<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>
    <link
      rel="stylesheet"href="{{ url_for('static', filename='css/login.css') }}">
  </head>
  <body>
    <div class="background-image"></div>
    <div class="login-container">
      <div class="divider"></div>
      <h2 style="margin-bottom:1.2rem;">User Login</h2>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
          <label>Username</label>
          <input
            type="text"
            name="username"
            placeholder="Enter your username"
            required
          >
        </div>

        <div class="form-group" style="position:relative;">
          <label>Password</label>
          <input
            type="password"
            name="password"
            placeholder="Enter your password"
            id="password-input"
            required
            style="padding-right:38px;"
          >
          <div class="show-password" id="show-password-toggle" tabindex="0" aria-label="Show password"
               style="position:absolute;top:38px;right:12px;height:22px;width:22px;display:flex;align-items:center;justify-content:center;background:none;box-shadow:none;margin-top:0;">
            <!-- Eye icon SVG (default: closed) -->
            <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" style="cursor:pointer;">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" stroke="#2d1457" stroke-width="2" fill="none"></path>
              <circle id="eye-dot" cx="12" cy="12" r="3" fill="#2d1457"></circle>
            </svg>
          </div>
        </div>

        <button type="submit" class="login-button"><span>Login</span></button>
      </form>
    </div>
    <script>
      // Show/hide password toggle with icon
      const pwd = document.getElementById('password-input');
      const toggle = document.getElementById('show-password-toggle');
      const eyeIcon = document.getElementById('eye-icon');
      const eyeDot = document.getElementById('eye-dot');
      let visible = false;

      function setEye(open) {
        if (open) {
          eyeIcon.innerHTML = `<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" stroke="#2d1457" stroke-width="2" fill="none"/>
          <circle cx="12" cy="12" r="3" fill="#2d1457"/>`;
        } else {
          eyeIcon.innerHTML = `<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" stroke="#2d1457" stroke-width="2" fill="none"/>
          <path d="M4 4l16 16" stroke="#2d1457" stroke-width="2"/>`;
        }
      }

      toggle.addEventListener('click', function() {
        visible = !visible;
        pwd.type = visible ? 'text' : 'password';
        setEye(visible);
      });
      toggle.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          visible = !visible;
          pwd.type = visible ? 'text' : 'password';
          setEye(visible);
        }
      });
      setEye(false);
    </script>
  </body>
</html>
