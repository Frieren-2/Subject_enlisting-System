<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="Admin Panel with Dark Theme" />
    <meta name="keywords" content="admin, dark theme, dashboard" />

    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/boxicons.min.css') }}">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/login.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/register.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/subject_dashboard.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/instructor_dashboard.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_dashboard.css') }}"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/student_list.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/available_sub.css') }}">

    <style>
    /* Milkyway highlight for active sidebar nav */
    .sidebar .nav-link.active {
        position: relative;
        background: rgba(255,255,255,0.10);
        border-radius: 14px;
        color: #fff !important;
        box-shadow: 0 2px 16px 0 rgba(161,140,209,0.18);
        z-index: 1;
        overflow: hidden;
    }
    .sidebar .nav-link.active::before {
        content: "";
        position: absolute;
        left: -30%;
        top: -40%;
        width: 160%;
        height: 180%;
        background: radial-gradient(ellipse at 60% 40%, rgba(255,255,255,0.22) 0%, rgba(161,140,209,0.10) 60%, transparent 100%);
        opacity: 0.7;
        pointer-events: none;
        z-index: -1;
        filter: blur(2px);
        transition: opacity 0.2s;
    }
    .sidebar .nav-link.active:hover::before {
        opacity: 1;
    }
    </style>
</head>
<body style="overflow: hidden;">
    <!-- Sidebar -->
    <div class="sidebar" style="background: rgba(35,41,70,0.72); backdrop-filter: blur(8px); min-height: 100vh; width: 220px; position: fixed; left: 0; top: 0; z-index: 100; box-shadow: 2px 0 12px #23294622;">
        <div class="text-center py-4 border-bottom" style="border-color: #353b4a !important;">
            <h5 class="text-white mb-0" style="letter-spacing: 1px;">Admin Panel</h5>
        </div>
        <ul class="nav flex-column mt-4" style="gap: 4px;">
            <li class="nav-item">
                <a class="nav-link {% if request.endpoint == 'admin_dashboard' %}active{% endif %}" href="{{ url_for('admin_dashboard') }}" style="color: #e1e1e1; font-weight: 500; display: flex; align-items: center; gap: 10px;">
                    <i class='bx bxs-dashboard'></i> Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.endpoint == 'Available_sub' %}active{% endif %}" href="{{ url_for('Available_sub') }}" style="color: #e1e1e1; font-weight: 500; display: flex; align-items: center; gap: 10px;">
                    <i class='bx bx-book-bookmark'></i> Available Subject
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.endpoint == 'student_list' %}active{% endif %}" href="{{ url_for('student_list') }}" style="color: #e1e1e1; font-weight: 500; display: flex; align-items: center; gap: 10px;">
                    <i class='bx bxs-user-detail'></i> Student List
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.endpoint == 'register' %}active{% endif %}" href="{{ url_for('register') }}" style="color: #e1e1e1; font-weight: 500; display: flex; align-items: center; gap: 10px;">
                    <i class='bx bxs-user-plus'></i> Add Instructor
                </a>
            </li>
            <li class="nav-item mt-auto">
                <a class="nav-link" href="" style="color: #e1e1e1; font-weight: 500; display: flex; align-items: center; gap: 10px;">
                    <i class='bx bx-user-plus'></i> Add Student
                </a>
            </li>
            <li class="nav-item mt-auto">
                <a class="nav-link text-danger" href="{{ url_for('logout') }}" style="font-weight: 500; display: flex; align-items: center; gap: 10px;">
                    <i class='bx bx-log-out'></i> Logout
                </a>
            </li>
        </ul>
    </div>

    <!-- Main Area -->
    <div class="main" style="margin-left: 220px; height: 100vh; display: flex; flex-direction: column;">
        <!-- Top Navbar -->
        <div class="topnav d-flex align-items-center justify-content-between px-4 py-3"
             style="background: rgba(35,41,70,0.68); backdrop-filter: blur(6px); border-bottom: 1px solid #353b4a; position: fixed; left: 220px; right: 0; top: 0; height: 64px; z-index: 101;">
            <div>
                <h5 class="mb-0" style="color: #a18cd1; font-weight: 600; letter-spacing: 1px;">Dashboard</h5>
            </div>
            <div class="username d-flex align-items-center gap-2" style="color: #e1e1e1;">
                <span style="font-size: 15px;">Welcome, Admin</span>
                <i class='bx bx-user-circle' style="font-size: 1.7rem;"></i>
            </div>
        </div>

        <!-- Content -->
        <div class="content px-4 py-4"
             style="min-height: 0; flex: 1 1 auto; margin-top: 64px; overflow-y: auto;">
            {% block content %}
            
            {% endblock %}
        </div>
    </div>
    
    {% block scripts %}
    <!-- Scripts -->
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/jquery-3.6.0.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/jquery.dataTables.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/dataTables.bootstrap5.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/admin_dashboard.js') }}"></script>
    {% endblock %}
</body>
</html>
